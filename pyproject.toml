[project]
name = "wisp-tui"
version = "0.1.0"
description = "Terminal chat client for the local Wisp runtime (loopback only, chat-scoped API)"
requires-python = ">=3.11"
dependencies = ["textual>=8.2"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "textual.*"
# Textual ships its own typing; treat as typed upstream.
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
